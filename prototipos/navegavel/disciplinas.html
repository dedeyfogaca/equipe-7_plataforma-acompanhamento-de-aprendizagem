<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Vértice — Disciplinas</title><link rel="stylesheet" href="base.css"></head>
<body><script src="ui.js"></script><script>
function conteudo(nm, qt, pc){
  return `<div class="cont">
    <span class="nm">${nm}</span>
    <span class="qt">${qt}</span>
    <div class="mini trilho"><i style="width:${pc}%"></i></div>
    <span class="pc">${pc}%</span>
  </div>`;
}
function disciplina(nm, mt, pc, conts, aberta){
  return `<div class="disc">
    <div class="topo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--textoSuave)"
        stroke-width="2.5" style="transform:rotate(${aberta?90:0}deg)"><path d="M9 6l6 6-6 6"/></svg>
      <div><div class="nm">${nm}</div><div class="mt">${mt}</div></div>
      <div class="pc"><b>${pc}%</b></div>
    </div>
    <div class="bar"><div class="trilho"><i style="width:${pc}%"></i></div></div>
    ${aberta ? `<div class="conts">${conts}</div>` : ''}
  </div>`;
}
montar('disciplinas', `
  <div class="cabeca">
    <div><h1>Disciplinas</h1>
      <div class="sub">A estrutura de estudo do grupo. Cada conteúdo recebe o progresso das suas atividades.</div></div>
    <button class="btn">+ Nova disciplina</button>
  </div>

  ${disciplina('Banco de Dados', '4 conteúdos · 18 atividades · peso 34 de 47', 72,
    conteudo('Modelo entidade-relacionamento', '5 atividades', 100) +
    conteudo('Álgebra relacional', '4 atividades', 75) +
    conteudo('Normalização', '5 atividades', 60) +
    conteudo('Consultas SQL avançadas', '4 atividades', 50), true)}

  ${disciplina('Engenharia de Software', '3 conteúdos · 11 atividades · peso 14 de 31', 45, '', false)}
  ${disciplina('Estrutura de Dados', '3 conteúdos · 9 atividades · peso 7 de 25', 28, '', false)}
  ${disciplina('Matemática Discreta', '2 conteúdos · nenhuma atividade ainda', 0, '', false)}

  <div style="margin-top:14px;font-size:12.5px;color:var(--textoSuave);
       display:flex;align-items:center;gap:7px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    Disciplina sem atividade cadastrada não entra no cálculo do progresso geral.
  </div>
`, `
  <div class="bloco"><div class="cap">Progresso geral
    <span class="num" style="color:var(--primariaForte);font-size:12.5px">62%</span></div>
    <div class="trilho"><i style="width:62%"></i></div>
    <div style="font-size:11px;color:var(--textoSuave);margin-top:7px">
      55 de 103 pontos concluídos</div>
  </div>
  <div class="bloco"><div class="cap">Onde falta avançar</div>
    ${barra('Estrutura de Dados', 28, '')}
    ${barra('Engenharia de Software', 45, '')}
  </div>
  <div class="bloco"><div class="cap">Como o cálculo funciona</div>
    <div style="background:var(--superficieAlt);border:1px solid var(--borda);
         border-radius:11px;padding:14px;font-size:12.5px;line-height:1.7;color:var(--texto)">
      O progresso é a razão entre o <b>peso das atividades concluídas</b> e o
      <b>peso total previsto</b> — não a contagem de atividades.
      <div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--borda);
           color:var(--textoSuave);font-size:11.5px">RN08 e RN14</div>
    </div>
  </div>
`);
</script></body></html>
