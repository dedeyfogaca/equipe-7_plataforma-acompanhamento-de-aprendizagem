<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Vértice — Primeiro acesso</title><link rel="stylesheet" href="base.css"></head>
<body><script src="ui.js"></script><script>
montar('painel', `
  <div class="cabeca">
    <div><h1>Grupo de Estatística</h1>
      <div class="sub">1 integrante · nenhuma disciplina · nenhuma atividade</div></div>
  </div>

  <div class="vazio">
    <div class="ic"><svg viewBox="0 0 24 24">
      <path d="M4 5.5A2.5 2.5 0 016.5 3H19v15H6.5A2.5 2.5 0 004 20.5zM4 5.5V20.5"/></svg></div>
    <b>Comece pela estrutura</b>
    <p>O Vértice calcula o progresso a partir das disciplinas e conteúdos.
       Cadastre a primeira disciplina para que as atividades tenham onde se ancorar.</p>
    <button class="btn">+ Primeira disciplina</button>
  </div>

  <div style="margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:11px">
    ${[['1','Disciplina','O que você estuda: Banco de Dados, Cálculo…'],
       ['2','Conteúdo','Os assuntos dentro dela: Normalização, Limites…'],
       ['3','Atividade','O que precisa ser feito, com peso e prazo']]
      .map(([n,t,d]) => `
      <div style="background:var(--superficie);border:1px solid var(--borda);
           border-radius:11px;padding:15px">
        <div style="width:24px;height:24px;border-radius:8px;background:var(--primariaSuave);
             color:var(--primariaForte);display:grid;place-items:center;font-weight:800;
             font-size:12px;font-family:JB;margin-bottom:10px">${n}</div>
        <div style="font-size:14px;font-weight:700;color:var(--textoForte);margin-bottom:4px">${t}</div>
        <div style="font-size:12.5px;color:var(--textoSuave);line-height:1.55">${d}</div>
      </div>`).join('')}
  </div>
`, `
  <div class="bloco"><div class="cap">Calendário</div>${calendario()}</div>
  <div class="bloco"><div class="cap">Meu desempenho</div>
    <div class="metricas">
      <div class="met"><div class="n">0</div><div class="l">Experiência</div></div>
      <div class="met d"><div class="n">0</div><div class="l">Dias seguidos</div></div>
    </div>
    <div style="font-size:11.5px;color:var(--textoSuave);margin-top:10px">
      A experiência aparece quando você concluir a primeira atividade.</div>
  </div>
`);
</script></body></html>
